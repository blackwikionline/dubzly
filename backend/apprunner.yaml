version: 1.0
runtime: python3
build:
  commands:
    pre-build:
      - python3 -m pip install --upgrade pip
    build:
      - pip install .
run:
  runtime-version: 3.11
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: PORT
  env:
    - name: APP_ENV
      value: production
